/* Every parameter that affects the form, so the command reproduces exactly
   what is on screen. growth.js takes the same names and defaults, and runs
   this very file, so the two cannot disagree. */
/* One flag per seed, in order, so the command reproduces the same arrangement. */
function seedFlags(){
  const seeds = (P.seeds || []).map(e => (typeof e === 'string'
    ? { key:e, dx:0, dy:0, rot:0, scale:1 } : e));
  return seeds.map(inst => {
    const d = resolveDrawn({ ...P, shape: inst.key });
    if (!d){
      // a built-in is generated by the algorithm, so its placement rides along
      const t = [inst.dx, inst.dy, inst.rot, inst.scale];
      const plain = t.every((v, i) => v === (i === 3 ? 1 : 0));
      return `--seed-shape ${inst.key}` + (plain ? '' : '@' + t.join(','));
    }
    // a traced outline is just points, so write them already placed
    const pts = transformPts(d.pts, inst)
      .map(q => (Math.round(q[0] * 1000) / 1000) + ',' + (Math.round(q[1] * 1000) / 1000))
      .join(' ');
    return `--${d.closed ? 'seed-path' : 'seed-open-path'} "${pts}"`;
  });
}
function nodeCommand(){
  const a = [
    'node growth.js',
    ...seedFlags(),
    `--seed ${P.seed}`,
    `--initial-nodes ${P.initialNodes}`,
    `--seed-radius ${P.startRadius}`,
    `--min-edge ${P.minEdge}`,
    `--max-edge ${P.maxEdge}`,
    `--repulsion-radius ${P.repulsionRadius}`,
    `--attraction-factor ${P.attractionFactor}`,
    `--repulsion-factor ${P.repulsionFactor}`,
    `--alignment-factor ${P.alignmentFactor}`,
    `--noise-factor ${P.noiseFactor}`,
    `--damping ${P.damping}`,
    `--smoothing ${P.smoothing}`,
    `--wall-repulsion ${P.wallRepulsion}`,
    `--repulsion-skip ${P.repulsionSkip}`,
    `--split-jitter ${P.splitJitter}`,
    `--max-nodes ${P.maxNodes}`,
    `--settle-at ${P.settleAt}`,
    `--style ${P.style}`,
    `--tension ${P.tension}`,
    `--fill ${P.fillOn ? P.fill : 'none'}`,
    `--stroke ${P.strokeOn ? P.stroke : 'none'}`,
    `--background ${P.bg}`,
    `--stroke-width ${(P.strokeWidth / view.scale).toFixed(2)}`,
  ];

  if (P.boundary) a.push(`--boundary-path "${P.boundary.map(q => q[0] + ',' + q[1]).join(' ')}"`);
  for (const o of (P.obstacles || []))
    a.push(`--obstacle-path "${o.map(q => q[0] + ',' + q[1]).join(' ')}"`);
  if (P.style === 'stipple'){
    a.push(`--dot-spacing ${P.stSpacing}`, `--dot-size ${P.stSizeMin},${P.stSizeMax}`,
           `--dot-scatter ${P.stScatMin},${P.stScatMax}`, `--dot-power ${P.stScatPow}`,
           `--dot-opacity ${P.stOpMin},${P.stOpMax}`,
           `--sketch-hue ${P.skHueMin},${P.skHueMax}`,
           `--sketch-sat ${P.skSatMin},${P.skSatMax}`,
           `--sketch-val ${P.skValMin},${P.skValMax}`);
  }
  if (P.style === 'contour'){
    a.push(`--echoes ${P.ctCount}`, `--echo-gap ${P.ctGap}`, `--echo-fade ${P.ctFade}`,
           `--sketch-hue ${P.skHueMin},${P.skHueMax}`,
           `--sketch-sat ${P.skSatMin},${P.skSatMax}`,
           `--sketch-val ${P.skValMin},${P.skValMax}`);
  }
  if (P.style === 'pencil'){
    a.push(`--sketch-passes ${P.skPasses}`, `--sketch-density ${P.skDensity}`,
           `--sketch-bow ${P.skBowMin},${P.skBowMax}`,
           `--sketch-wander ${P.skJitMin},${P.skJitMax}`,
           `--sketch-length ${P.skLenMin},${P.skLenMax}`,
           `--sketch-width ${P.skWidthMin},${P.skWidthMax}`,
           `--sketch-opacity ${P.skOpMin},${P.skOpMax}`,
           `--sketch-hue ${P.skHueMin},${P.skHueMax}`,
           `--sketch-sat ${P.skSatMin},${P.skSatMax}`,
           `--sketch-val ${P.skValMin},${P.skValMax}`);
  }
  if (P.style === 'calligraphic'){
    a.push(`--width-by ${P.clWidthMode}`, `--pen-width ${P.clWidthLo},${P.clWidthHi}`);
    if (P.clWidthMode === 'alignment')
      a.push(`--pen-angle ${P.clPenAngle}`, `--pen-field ${P.clPenField}`, `--pen-turns ${P.clPenTurns}`);
    a.push(`--sketch-hue ${P.skHueMin},${P.skHueMax}`,
           `--sketch-sat ${P.skSatMin},${P.skSatMax}`,
           `--sketch-val ${P.skValMin},${P.skValMax}`);
  }
  if (P.pruneShort) a.push('--prune-short');
  a.push(`--output ${tag()}.svg`);
  return a.join(' ');
}

/* ---------- drawing: seeds, boundaries and obstacles ---------- */
/* Traced outlines are kept in the coordinates they were drawn at, so what the
   simulation uses is exactly the line on screen. */
const draw_ = { on:false, target:'seedClosed', pts:[], stroking:false };
const DRAW_MODES = {
  seedClosed: { closed:true,  msg:'Drag to trace a closed outline' },
  seedOpen:   { closed:false, msg:'Drag to trace an open strand' },
  boundary:   { closed:true,  msg:'Trace the area the growth must stay inside' },
  obstacle:   { closed:true,  msg:'Trace an area the growth must keep out of' },
};

let shapeSeq = 0;
function nextShapeName(closed){
  const drawn = P.drawnShapes || [];
  const stem = closed ? 'shape' : 'strand';
  let n = 1;
  while (drawn.some(d => d.name === stem + ' ' + n)) n++;
  return stem + ' ' + n;
}
function newShapeId(){
  shapeSeq++;
  return 's' + shapeSeq + Math.floor(performance.now() % 100000).toString(36);
}

function beginDraw(target){
  draw_.on = true; draw_.target = target; draw_.pts = []; draw_.stroking = false;
  setRunning(false);
  document.getElementById('stage').classList.add('drawing');
  const seed = target === 'seedClosed' || target === 'seedOpen';
  setBarMode(seed ? 'trace' : 'constraint');
  document.getElementById('drawMsg').textContent = DRAW_MODES[target].msg;
  draw();
}
function endDraw(){
  draw_.on = false; draw_.stroking = false;
  document.getElementById('stage').classList.remove('drawing');
  if (pendingIdx < 0) setBarMode('off');
  draw();
}
function updateDrawBar(){
  const min = DRAW_MODES[draw_.target].closed ? 3 : 2;
  const ok = draw_.pts.length >= min;
  document.getElementById('drawUse').disabled = !ok;
  document.getElementById('barAdd').disabled = !ok;
  document.getElementById('barReplace').disabled = !ok;
}

/* Keep the stroke where it was drawn, rounded to 3 decimals so it survives a
   trip through a command line or a settings file unchanged. */
function tidyPts(pts){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts){
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  if (!(maxX - minX > 1e-6 || maxY - minY > 1e-6)) return null;
  return pts.map(p => [ +p[0].toFixed(3), +p[1].toFixed(3) ]);
}


document.getElementById('drawBoundary').onclick = () => beginDraw('boundary');
document.getElementById('drawObstacle').onclick = () => beginDraw('obstacle');
document.getElementById('drawClear').onclick = () => { draw_.pts = []; updateDrawBar(); draw(); };

document.getElementById('drawUse').onclick = () => {
  const pts = tidyPts(draw_.pts);
  if (!pts){ flash('That outline is too small to use'); return; }
  const target = draw_.target;
  if (target === 'boundary'){ P.boundary = pts; }
  else { P.obstacles = (P.obstacles || []).concat([pts]); }
  endDraw();
  renderConstraints();
  syncAll();
  restart({ play:false });
  const bad = sim.seedViolations();
  if (bad) flash(bad + ' seed node' + (bad > 1 ? 's are' : ' is') + ' outside the boundary');
  else flash((target === 'boundary' ? 'Boundary' : 'Obstacle') + ' set \u2014 ' + pts.length + ' points.');
};

/* ---------- constraint chips ---------- */
function renderConstraints(){
  const box = document.getElementById('constraints');
  box.innerHTML = '';
  const items = [];
  if (P.boundary) items.push(['boundary', () => { P.boundary = null; }]);
  (P.obstacles || []).forEach((o, i) =>
    items.push([(P.obstacles.length > 1 ? 'obstacle ' + (i + 1) : 'obstacle'),
                () => { P.obstacles = P.obstacles.filter((_, k) => k !== i); }]));
  if (!items.length) return;
  for (const [label, remove] of items){
    const chip = document.createElement('span');
    chip.className = 'chip saved';
    const name = document.createElement('button');
    name.textContent = label; name.title = 'Drawn constraint';
    const del = document.createElement('button');
    del.className = 'x'; del.textContent = '\u00d7'; del.title = 'Remove';
    del.onclick = () => { remove(); renderConstraints(); restart({ play:false }); };
    chip.appendChild(name); chip.appendChild(del);
    box.appendChild(chip);
  }
}

/* ---------- importing an outline from an SVG ---------- */
/* The browser can already walk any SVG shape: getPointAtLength on a path, rect,
   circle, polygon and the rest gives points along it without parsing a single
   path command. So the file is put into a detached SVG, every shape in it is
   sampled at an even spacing, and each becomes a traced outline. */
const IMPORT_SPACING = 6;        // sample spacing, in the file's own units
const IMPORT_SPAN = 2.6;         // the import is scaled to this many seed radii

function importSvg(){
  const f = document.createElement('input');
  f.type = 'file';
  f.accept = '.svg,image/svg+xml';
  f.onchange = () => {
    const file = f.files && f.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try { useSvg(r.result, file.name); }
      catch (err){ flash('Could not read that SVG'); }
    };
    r.readAsText(file);
  };
  f.click();
}

function sampleShapes(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const root = doc.documentElement;
  if (!root || root.nodeName === 'parsererror') return [];

  // it has to be in the page for the geometry calls to work
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;opacity:0';
  host.appendChild(document.importNode(root, true));
  document.body.appendChild(host);

  const out = [];
  try {
    const live = host.firstElementChild;
    const els = live.querySelectorAll('path,polygon,polyline,rect,circle,ellipse,line');
    for (const el of els){
      if (typeof el.getTotalLength !== 'function') continue;
      let len = 0;
      try { len = el.getTotalLength(); } catch { continue; }
      if (!(len > 1)) continue;

      // a path that closes itself, or a shape that is closed by definition
      const d = (el.getAttribute('d') || '').trim();
      const closed = el.nodeName === 'path' ? /[zZ]\s*$/.test(d)
                   : !['polyline', 'line'].includes(el.nodeName);

      const m = el.getCTM ? el.getCTM() : null;    // any transforms above it
      const count = Math.max(closed ? 3 : 2, Math.min(4000, Math.round(len / IMPORT_SPACING)));
      const pts = [];
      for (let i = 0; i < count; i++){
        const p = el.getPointAtLength((i / count) * len * (closed ? 1 : count / (count - 1)));
        pts.push(m ? [p.x * m.a + p.y * m.c + m.e, p.x * m.b + p.y * m.d + m.f] : [p.x, p.y]);
      }
      out.push({ pts, closed, len });
    }
  } finally {
    host.remove();
  }
  // biggest first, so the main outline leads and stray detail follows
  return out.sort((a, b) => b.len - a.len);
}

function useSvg(text, filename){
  const shapes = sampleShapes(text);
  if (!shapes.length){ flash('No shapes found in that SVG'); return; }

  // one scale and offset for the whole file, so the parts stay in register
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of shapes) for (const p of s.pts){
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  const span = Math.max(maxX - minX, maxY - minY) || 1;
  const k = (P.startRadius * IMPORT_SPAN) / span;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

  prevSeeds = (P.seeds || []).map(e => ({ ...e }));
  const stem = (filename || 'import').replace(/\.svg$/i, '').slice(0, 24);
  const added = [];
  shapes.forEach((s, i) => {
    const pts = s.pts.map(p => [ +((p[0] - cx) * k).toFixed(3), +((p[1] - cy) * k).toFixed(3) ]);
    const entry = { id: newShapeId(), closed: s.closed, pts,
                    name: shapes.length > 1 ? stem + ' ' + (i + 1) : stem };
    P.drawnShapes = (P.drawnShapes || []).concat([entry]);
    added.push({ key: 'drawn:' + entry.id, dx: 0, dy: 0, rot: 0, scale: 1 });
  });

  P.seeds = (P.seeds || []).concat(added);
  pendingIdx = P.seeds.length - added.length;   // cancel drops the whole import
  selSeed = P.seeds.length - 1;
  setBarMode('place');
  renderShapes();
  applyShapeDefaults();
  syncAll();
  restart({ play:false });
  flash('Imported ' + shapes.length + ' outline' + (shapes.length > 1 ? 's' : '')
        + ' from ' + (filename || 'the file'));
}

/* ---------- saved settings ---------- */
/* Every field that defines a form. View state (pan/zoom) is deliberately not
   saved: the same settings should reproduce the same growth, not the same
   camera. Stroke width is screen-relative, so it rides along with the look. */
const SAVED_KEYS = Object.keys(P);
const STORE = 'diffgrowth.presets.v1';

function readStore(){
  try { return JSON.parse(localStorage.getItem(STORE) || '{}'); }
  catch { return {}; }
}
function writeStore(obj){
  try { localStorage.setItem(STORE, JSON.stringify(obj)); return true; }
  catch { flash('Could not save \u2014 browser storage is unavailable'); return false; }
}
function currentSettings(){
  const o = {};
  for (const k of SAVED_KEYS) o[k] = P[k];
  // with auto-fit off the view is a choice, so it travels with the settings
  o.frame = P.follow ? null : frameFromView();
  return o;
}
function applySettings(o){
  for (const k of SAVED_KEYS) if (k in o) P[k] = o[k];
  migrateDrawn(o);
  migrateSketch(o);
  if (P.frame && !P.follow) viewFromFrame(P.frame);
  lastOpenKind = isOpenShape();
  fillAutoOff = false;
  const sel = document.getElementById('theme');
  if (sel) sel.value = '';
  syncAll(); restart();
}

function renderSaved(){
  const box = document.getElementById('saved');
  const all = readStore();
  const names = Object.keys(all).sort();
  box.innerHTML = '';
  if (!names.length) return;
  for (const name of names){
    const chip = document.createElement('span');
    chip.className = 'chip saved';
    const label = document.createElement('button');
    label.textContent = name;
    label.title = 'Load these settings';
    label.onclick = () => applySettings(all[name]);
    const del = document.createElement('button');
    del.className = 'x'; del.textContent = '\u00d7';
    del.title = 'Delete';
    del.onclick = (ev) => {
      ev.stopPropagation();
      const store = readStore();
      delete store[name];
      if (writeStore(store)){ renderSaved(); flash('Deleted "' + name + '"'); }
    };
    chip.appendChild(label); chip.appendChild(del);
    box.appendChild(chip);
  }
}

document.getElementById('saveCur').onclick = () => {
  const name = (prompt('Name these settings:', 'untitled') || '').trim();
  if (!name) return;
  const store = readStore();
  if (store[name] && !confirm('"' + name + '" already exists. Replace it?')) return;
  store[name] = currentSettings();
  if (writeStore(store)){ renderSaved(); flash('Saved "' + name + '"'); }
};

/* A link carries the settings without needing storage at all, which is how
   you move a form to another machine or hand it to someone else. */
document.getElementById('copyLink').onclick = (e) => {
  const url = location.origin + location.pathname
            + '#' + encodeURIComponent(JSON.stringify(currentSettings()));
  navigator.clipboard.writeText(url).then(() => {
    const b = e.target, old = b.textContent;
    b.textContent = 'Copied \u2713'; setTimeout(() => b.textContent = old, 1200);
  });
};
document.getElementById('expJson').onclick = () => {
  download(new Blob([JSON.stringify(currentSettings(), null, 2)], {type:'application/json'}),
           tag() + '.json');
};
document.getElementById('impJson').onclick = () => {
  const f = document.createElement('input');
  f.type = 'file'; f.accept = '.json,application/json';
  f.onchange = () => {
    const file = f.files && f.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try { applySettings(JSON.parse(r.result)); flash('Loaded ' + file.name); }
      catch { flash('That file is not a settings file'); }
    };
    r.readAsText(file);
  };
  f.click();
};

/* Settings saved when there were only two fixed slots. */
/* Settings saved when these were a value plus a spread. */
function migrateSketch(o){
  if (!o) return;
  // a single bow/wander value becomes a range with both ends the same
  if (o.skBowMin === undefined && o.skBow !== undefined){
    P.skBowMin = P.skBowMax = o.skBow;
  }
  if (o.skJitMin === undefined && o.skJitter !== undefined){
    P.skJitMin = P.skJitMax = o.skJitter;
  }
  // scatter used to be spread evenly, which is what a power of 5 gives
  if (o.stScatPow === undefined) P.stScatPow = 5;
  if (o.skLenMin !== undefined) return;
  const band = (v, spread, lo, hi) => [Math.max(lo, v * (1 - spread)), Math.min(hi, v * (1 + spread))];
  if (o.skLength !== undefined){
    const [a, b] = band(o.skLength, o.skLenVar === undefined ? 0.6 : o.skLenVar, 4, 160);
    P.skLenMin = Math.round(a); P.skLenMax = Math.round(b);
  }
  const wv = o.skWidthVar === undefined ? 0.6 : o.skWidthVar;
  P.skWidthMin = Math.max(0.1, 1 - wv); P.skWidthMax = Math.min(2.5, 1 + wv);
  if (o.skOpacity !== undefined){
    const ov = o.skOpacityVar === undefined ? 0.7 : o.skOpacityVar;
    P.skOpMin = Math.max(0, o.skOpacity * (1 - ov)); P.skOpMax = o.skOpacity;
  }
}

function migrateDrawn(o){
  if (!o || (P.drawnShapes && P.drawnShapes.length)) return;
  const made = [];
  if (o.drawnClosed) made.push({ id:'legacy-c', name:'shape 1', closed:true,  pts:o.drawnClosed });
  if (o.drawnOpen)   made.push({ id:'legacy-o', name:'strand 1', closed:false, pts:o.drawnOpen });
  if (!made.length) return;
  P.drawnShapes = made;
  if (o.shape === 'drawn')     P.shape = 'drawn:legacy-c';
  if (o.shape === 'drawnLine') P.shape = 'drawn:legacy-o';
}

function loadFromHash(){
  if (!location.hash || location.hash.length < 3) return false;
  try {
    const o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    for (const k of SAVED_KEYS) if (k in o) P[k] = o[k];
    migrateDrawn(o);
    migrateSketch(o);
    return true;
  } catch { return false; }
}

/* ---------- go ---------- */
const fromLink = loadFromHash();
lastOpenKind = isOpenShape();
renderSaved();
renderConstraints();
syncAll();
resize();
if (fromLink){ sim.reset(); fit(true); flash('Loaded settings from link'); }
setRunning(true);
requestAnimationFrame(frame);
</script>
</body>
